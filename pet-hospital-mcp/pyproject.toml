[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "MCP adapter for the Go Pet Hospital REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.0.0,<3",
  "httpx>=0.27.0,<1",
  "pydantic>=2.7.0,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
